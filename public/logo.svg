<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <title>compviz</title>
  <!-- a2coder labs tokens: .accent = orange-500, .ink = primary (light #18181b / dark #e4e4e7) -->
  <style>
    .accent { fill: #ff6900; stroke: #ff6900; }
    .ink { fill: #18181b; stroke: #18181b; }
    @media (prefers-color-scheme: dark) { .ink { fill: #e4e4e7; stroke: #e4e4e7; } }
  </style>
  <defs>
    <!-- isometric cube centred on its front vertex (0,0), half-width 9 -->
    <mask id="cube-cut" maskUnits="userSpaceOnUse" x="-12" y="-12" width="24" height="24">
      <path d="M0-9 9-4.5v9L0 9-9 4.5v-9z" fill="#fff" stroke="#fff" stroke-width="1" stroke-linejoin="round"/>
      <g stroke="#000" stroke-linecap="round">
        <path d="M0 0-10-5M0 0 10-5M0 0v10" stroke-width=".9"/>
        <path d="M-7 -1.5v5M-4.75 -.4v5M-2.5 .75v5" stroke-width=".9"/>
      </g>
    </mask>
    <path id="cube" d="M0-9 9-4.5v9L0 9-9 4.5v-9z" stroke-width="1" stroke-linejoin="round" mask="url(#cube-cut)"/>
  </defs>
  <g class="ink" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M23.8 24.1 19.8 26.1Q17 27.5 17 30v.2M40.2 24.1l4 2Q47 27.5 47 30v.2" fill="none"/>
    <circle cx="17" cy="32" r="1.6" fill="none"/>
    <circle cx="47" cy="32" r="1.6" fill="none"/>
    <path d="M17 33.8V35.5M47 33.8V35.5" fill="none"/>
  </g>
  <use href="#cube" class="ink" x="17" y="44"/>
  <use href="#cube" class="ink" x="47" y="44"/>
  <use href="#cube" class="accent" x="32" y="20"/>
</svg>
